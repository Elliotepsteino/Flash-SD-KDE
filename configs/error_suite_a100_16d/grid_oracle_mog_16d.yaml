suite:
  name: error_suite_a100_16d
  out_dir: file_storage/error_suite_a100_16d/${timestamp}
  seed: 0
  device: cuda
  require_gpu_name_contains: A100
  hard_fail_if_not_a100: false
  deterministic: false
  enable_tf32: false
  matmul_precision: high
  cudnn_benchmark: true

experiment:
  kind: oracle_error_16d
  repeats: 3
  warmup: 2
  timing_repeats: 1

data:
  dataset: gm_diag_16d
  dim: 16
  standardize: true
  n_train: 5000
  n_test: 10000
  distribution_params:
    n_components: 8
    component_std: 1.0
    mean_scale: 2.0
    weights: uniform

kde:
  kernel: gaussian
  output: log_density
  bandwidth:
    mode: rule_times_scale
    rule: silverman_diag
    scale: 1.0
  chunking:
    enabled: true
    query_chunk_size: 2048
    sample_chunk_size: 32768

flash_impl:
  enabled: true
  emp_score_backend: symmetric_atomic
  precision_mode: fp32_ieee
  kde_backend: splitk_stream
  use_precomputed_norms: true
  autotune: false
  params:
    compute_dtype: fp32
    accumulate_dtype: fp32
    block_q: 128
    block_n: 128
    num_warps: 4
    num_stages: 2

oracle:
  method: kde
  clamp_nonnegative: true
  clamp_eps: 1e-30
  nonfused_device: cuda
  nonfused_dtype: fp32

sweep:
  fail_fast: false
  parameters:
    data.n_train: [3000, 10000, 30000, 100000, 500000]
    oracle.method: [kde, flash_laplace, nonfused_laplace, emp_sd_kde]
