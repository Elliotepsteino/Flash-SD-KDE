suite:
  name: error_suite_16d
  out_dir: file_storage/error_suite_16d/${timestamp}
  seed: 0
  device: cuda
  require_gpu_name_contains: A100
  hard_fail_if_not_a100: false
  deterministic: false
  enable_tf32: false
  matmul_precision: high
  cudnn_benchmark: true

experiment:
  kind: kde_correctness_logspace
  repeats: 2
  warmup: 3
  timing_repeats: 3

data:
  dataset: gm_diag_16d
  dim: 16
  standardize: true
  n_train: 100000
  n_test: 20000
  distribution_params:
    n_components: 8
    component_std: 1.0
    mean_scale: 2.0
    weights: uniform

kde:
  kernel: gaussian
  output: log_density
  bandwidth:
    mode: rule_times_scale
    rule: silverman_diag
    scale: 1.0
  chunking:
    enabled: true
    query_chunk_size: 32768
    sample_chunk_size: 65536

flash_impl:
  enabled: true
  precision_mode: fp32_ieee
  kde_backend: splitk_stream
  use_precomputed_norms: true
  autotune: true
  params:
    compute_dtype: bf16
    accumulate_dtype: fp32
    block_q: 128
    block_n: 128
    num_warps: 4
    num_stages: 2

reference_impl:
  enabled: true
  type: torch_chunked_fp64_logspace
  params:
    dtype: fp64
    use_logsumexp: true
    tier2_fp32_if_too_slow: true
    tier2_max_pairs: 2e9
    tier1_subsample:
      enabled: true
      n_ref: 50000
      n_test_ref: 20000

checks:
  enabled: true
  max_abs_log_err: 0.12
  rmse_log_err: 0.05
  min_finite_fraction_flash: 0.95

sweep:
  fail_fast: false
  parameters:
    flash_impl.params.compute_dtype: [bf16, fp32]
    kde.bandwidth.scale: [1.0, 2.0]
    suite.enable_tf32: [false, true]
