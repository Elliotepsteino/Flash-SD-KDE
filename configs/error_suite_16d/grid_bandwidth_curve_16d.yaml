suite:
  name: error_suite_16d
  out_dir: file_storage/error_suite_16d/${timestamp}
  seed: 0
  device: cuda
  require_gpu_name_contains: A100
  hard_fail_if_not_a100: false
  deterministic: false
  enable_tf32: false
  matmul_precision: high
  cudnn_benchmark: true

experiment:
  kind: kde_bandwidth_curve_16d
  repeats: 3
  warmup: 3
  timing_repeats: 3

data:
  dataset: gm_diag_16d
  dim: 16
  standardize: true
  n_train: 200000
  n_test: 50000
  distribution_params:
    n_components: 8
    component_std: 1.0
    mean_scale: 2.0
    weights: uniform

kde:
  kernel: gaussian
  output: log_density
  bandwidth:
    mode: rule_times_scale
    rule: silverman_diag
    scale: 1.0

flash_impl:
  enabled: true
  precision_mode: fast_tf32
  kde_backend: splitk_stream
  use_precomputed_norms: true
  autotune: true
  params:
    compute_dtype: bf16
    accumulate_dtype: fp32

reference_impl:
  enabled: false
  type: torch_chunked_fp64_logspace
  params:
    dtype: fp64
    use_logsumexp: true
    tier2_fp32_if_too_slow: true
    tier2_max_pairs: 2e9
    tier1_subsample:
      enabled: false

statistical:
  enabled: true
  metrics:
    compute_nll: true
    compute_kl: true
    compute_log_mse: true
    compute_ise: true

sweep:
  fail_fast: false
  parameters:
    kde.bandwidth.scale: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]
