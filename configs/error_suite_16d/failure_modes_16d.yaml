suite:
  name: error_suite_a100_16d
  out_dir: file_storage/error_suite_a100_16d/${timestamp}
  seed: 0
  device: cuda
  require_gpu_name_contains: A100
  hard_fail_if_not_a100: false
  deterministic: false
  enable_tf32: false
  matmul_precision: high
  cudnn_benchmark: true

experiment:
  kind: failure_modes_16d
  repeats: 1
  warmup: 1
  timing_repeats: 1

data:
  dataset: gm_diag_16d
  dim: 16
  standardize: false
  n_train: 500000
  n_test: 100000
  distribution_params:
    n_components: 8
    component_std: 1.0
    mean_scale: 8.0
    weights: uniform

kde:
  kernel: gaussian
  output: log_density
  bandwidth:
    mode: rule_times_scale
    rule: silverman_diag
    scale: 0.05
  chunking:
    enabled: true
    query_chunk_size: 16384
    sample_chunk_size: 32768

flash_impl:
  enabled: true
  precision_mode: fast_tf32
  kde_backend: splitk_stream
  use_precomputed_norms: true
  autotune: true
  params:
    compute_dtype: fp16
    accumulate_dtype: fp16
    block_q: 128
    block_n: 128
    num_warps: 4
    num_stages: 2

reference_impl:
  enabled: false

checks:
  enabled: false
